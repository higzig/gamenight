<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Night Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="adminGateway" class="auth-gateway" aria-live="polite"></main>
  <div class="app-shell" id="adminApp" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">GN</div>
        <div><strong>Game Night</strong><span>Host Admin</span></div>
      </div>
      <nav>
        <button class="nav-item active nav-primary" data-view="night"><span>◈</span> Game Night</button>
        <button class="nav-item" data-view="teams"><span>◎</span> Teams</button>
        <button class="nav-item" data-view="leaderboard"><span>↗</span> Leaderboard</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <div><strong>Connected</strong></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button class="gn-back-link" id="backToProjects">← My Projects</button><h1 id="eventTitle">Thursday Game Night</h1>
          <p class="event-status-line" id="eventStatusLine"></p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="headerAudience">Audience ↗</button>
          <details class="admin-menu"><summary class="icon-btn" aria-label="Project and audience options">•••</summary><div><div id="audienceOverride"></div><button id="switchEvent">My Projects</button><button id="logoutHost">Log out</button><button id="resetDemo" class="dev-only">Reset demo</button></div></details>
        </div>
      </header>

      <div id="hostAlert" class="host-alert" role="alert" hidden><p id="hostAlertText"></p><button class="icon-btn" id="hostAlertDismiss" aria-label="Dismiss message">×</button></div>

      <section id="view-night" class="view active">
        <div id="nightOverview" class="gn-dashboard"></div>
        <div id="nightConfigure" class="gn-config" hidden>
          <button class="btn ghost gn-config-back" id="configBack">← Tonight’s Games</button>
          <header class="gn-config-head" id="configIdentity"></header>
          <p id="gameSettingsError" class="settings-error" role="alert" hidden></p>
          <div id="drawerBody" class="drawer-body gn-config-body"></div>
          <footer class="gn-config-footer"><p id="configNote">Changes apply when you press Save Game.</p><div class="gn-config-buttons"><button class="btn ghost" id="cancelConfig">Cancel</button><button class="btn primary" id="doneRound">Save Game</button></div></footer>
        </div>
        <div id="nightStage" hidden><div id="liveControl"></div></div>
      </section>

      <section id="view-teams" class="view">
        <div class="section-heading compact">
          <div><h2>Teams</h2><p id="teamsSummary">Joined Teams</p></div>
          <button class="btn secondary dev-only" id="addTeam">+ Add team</button>
        </div>
        <div class="panel"><div id="teamsTable"></div></div>
      </section>

      <section id="view-leaderboard" class="view">
        <div class="section-heading compact">
          <div><h2>Leaderboard</h2></div>
          <button class="btn secondary" id="leaderboardAudience">Show on Audience</button>
        </div>
        <div class="panel"><div id="leaderboardTable"></div></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal gn-library-modal" id="roundModal" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
    <div class="modal-head"><div><p class="eyebrow" id="libraryEyebrow">GAME LIBRARY</p><h2 id="libraryTitle">Choose a game</h2></div><button class="icon-btn" id="closeModal" aria-label="Close game library">×</button></div>
    <div class="game-picker" id="gamePicker"></div>
  </div>

  <script type="module" src="/src/admin-entry.js"></script>
</body>
</html>
